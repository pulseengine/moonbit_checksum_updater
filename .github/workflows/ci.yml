name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BAZEL_VERSION: 8.2.1

jobs:
  build:
    name: Build and Test
    # Stays on ubuntu-latest: Bazel + bazelisk not in smithy toolchains; also uses sudo mv to /usr/local/bin
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          curl -LO https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel

      - name: Install wsc
        run: |
          curl -L -o wsc https://github.com/pulseengine/wsc/releases/download/v0.5.1/wsc-linux-x86_64
          chmod +x wsc
          sudo mv wsc /usr/local/bin/wsc

      - name: Build WASI CLI Component
        run: |
          bazel build //:checksum_updater_wasi

      - name: Verify Component
        run: |
          # Check the component was built
          ls -la bazel-bin/*.wasm || ls -la bazel-bin/**/*.wasm || echo "Checking component output..."

          # Validate it's a proper WASM component
          bazel run @rules_wasm_component//tools:wasm_tools -- component wit bazel-bin/checksum_updater_wasi.wasm || true

      - name: Sign WASM with wsc (keyless)
        run: |
          wsc sign --keyless \
            -i bazel-bin/checksum_updater_wasi.wasm \
            -o checksum_updater_wasi.signed.wasm
          mv checksum_updater_wasi.signed.wasm checksum_updater_wasi.wasm

      - name: Create SHA256 checksum
        run: |
          sha256sum checksum_updater_wasi.wasm > checksum_updater_wasi.wasm.sha256

      - name: Generate GitHub attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation create checksum_updater_wasi.wasm \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload signed WASM
        uses: actions/upload-artifact@v4
        with:
          name: checksum_updater_wasi-signed
          path: |
            checksum_updater_wasi.wasm
            checksum_updater_wasi.wasm.sha256
          retention-days: 90

  build-macos:
    name: Build on macOS
    # Stays on macos-latest: smithy phase 1 is Linux-only
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          brew install bazelisk

      - name: Install wsc
        run: |
          curl -L -o wsc https://github.com/pulseengine/wsc/releases/download/v0.5.1/wsc-macos-aarch64
          chmod +x wsc
          sudo mv wsc /usr/local/bin/wsc

      - name: Build WASI CLI Component
        run: |
          bazel build //:checksum_updater_wasi

      - name: Sign WASM with wsc (keyless)
        run: |
          wsc sign --keyless \
            -i bazel-bin/checksum_updater_wasi.wasm \
            -o checksum_updater_wasi.signed.wasm
          mv checksum_updater_wasi.signed.wasm checksum_updater_wasi.wasm

      - name: Create SHA256 checksum
        run: |
          shasum -a 256 checksum_updater_wasi.wasm > checksum_updater_wasi.wasm.sha256

      - name: Generate GitHub attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation create checksum_updater_wasi.wasm \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload signed WASM
        uses: actions/upload-artifact@v4
        with:
          name: checksum_updater_wasi-macos-signed
          path: |
            checksum_updater_wasi.wasm
            checksum_updater_wasi.wasm.sha256
          retention-days: 90

  moonbit:
    name: MoonBit Check and Test
    runs-on: [self-hosted, linux, x64, rust-cpu]

    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: moon install

      - name: Check (native target)
        run: moon check --target native

      - name: Test (native target)
        run: moon test --target native -p lib
