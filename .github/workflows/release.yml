name: Release

on:
  push:
    tags:
      - "v*"

env:
  BAZEL_VERSION: 8.2.1

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          curl -LO https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel

      - name: Install wsc
        run: |
          curl -L -o wsc https://github.com/pulseengine/wsc/releases/download/v0.5.1/wsc-linux-x86_64
          chmod +x wsc
          sudo mv wsc /usr/local/bin/wsc

      - name: Build WASI CLI Component
        run: bazel build //:checksum_updater_wasi

      - name: Verify Component
        run: |
          bazel run @rules_wasm_component//tools:wasm_tools -- component wit bazel-bin/checksum_updater_wasi.wasm || true

      - name: Sign WASM with wsc (keyless)
        run: |
          wsc sign --keyless \
            -i bazel-bin/checksum_updater_wasi.wasm \
            -o checksum_updater_wasi.signed.wasm
          mv checksum_updater_wasi.signed.wasm checksum_updater_wasi.wasm

      - name: Create SHA256 checksum
        run: sha256sum checksum_updater_wasi.wasm > checksum_updater_wasi.wasm.sha256

      - name: Generate GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation create checksum_updater_wasi.wasm \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasi-linux
          path: |
            checksum_updater_wasi.wasm
            checksum_updater_wasi.wasm.sha256

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Install wsc
        run: |
          curl -L -o wsc https://github.com/pulseengine/wsc/releases/download/v0.5.1/wsc-macos-aarch64
          chmod +x wsc
          sudo mv wsc /usr/local/bin/wsc

      - name: Build WASI CLI Component
        run: bazel build //:checksum_updater_wasi

      - name: Sign WASM with wsc (keyless)
        run: |
          wsc sign --keyless \
            -i bazel-bin/checksum_updater_wasi.wasm \
            -o checksum_updater_wasi.signed.wasm
          mv checksum_updater_wasi.signed.wasm checksum_updater_wasi.wasm

      - name: Create SHA256 checksum
        run: shasum -a 256 checksum_updater_wasi.wasm > checksum_updater_wasi.wasm.sha256

      - name: Generate GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation create checksum_updater_wasi.wasm \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasi-macos
          path: |
            checksum_updater_wasi.wasm
            checksum_updater_wasi.wasm.sha256

  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasi-linux
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasi-macos
          path: artifacts/macos

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/linux/checksum_updater_wasi.wasm release/checksum_updater_wasi-linux.wasm
          cp artifacts/linux/checksum_updater_wasi.wasm.sha256 release/checksum_updater_wasi-linux.wasm.sha256
          cp artifacts/macos/checksum_updater_wasi.wasm release/checksum_updater_wasi-macos.wasm
          cp artifacts/macos/checksum_updater_wasi.wasm.sha256 release/checksum_updater_wasi-macos.wasm.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            release/*
